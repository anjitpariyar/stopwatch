<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <mask id="keyhole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="572" r="24" fill="#000"/>
      <path d="M498 584 L526 584 L534 630 L490 630 Z" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(512 512) scale(1.3) translate(-512 -512)">
    <circle cx="512" cy="512" r="290" fill="none" stroke="#2A2724" stroke-width="20" opacity="1"/>
    <path d="M512 222 A290 290 0 1 1 260.9 367.0" fill="none" stroke="#4CFF7E" stroke-width="20" stroke-linecap="round" opacity="0.35" filter="url(#soft)"/>
    <path d="M512 222 A290 290 0 1 1 260.9 367.0" fill="none" stroke="#4CFF7E" stroke-width="20" stroke-linecap="round" opacity="0.6"/>
    <circle cx="260.9" cy="367.0" r="30" fill="#4CFF7E" filter="url(#glow)"/>
    <!-- open shackle: right leg stays in the body, left leg lifted free -->
    <path d="M596 506 V412 A84 84 0 0 0 428 412 V446" fill="none" stroke="#F5F5F4" stroke-width="42" stroke-linecap="round"/>
    <rect x="388" y="494" width="248" height="190" rx="40" fill="#F5F5F4" mask="url(#keyhole)"/>
  </g></svg>